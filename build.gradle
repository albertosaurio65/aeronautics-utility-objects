buildscript {
    repositories {
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenLocal()
    }
    dependencies {
        classpath 'net.neoforged:moddev-gradle:2.0.141'
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

apply plugin: 'net.neoforged.moddev'

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = findProperty('artifact_id') ?: mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

repositories {
    maven {
        name = 'Sable Releases'
        url = 'https://maven.ryanhcode.dev/releases'
    }
    maven {
        name = 'Local Maven Metadata'
        url = uri(new File(System.getProperty('user.home'), '.m2/repository'))
        metadataSources {
            gradleMetadata()
            mavenPom()
            artifact()
        }
    }
    mavenLocal()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources').getAbsolutePath(),
                    '--existing', file('src/main/resources').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'], exclude: ['sable-neoforge-*.jar'])
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_api_version}") {
        transitive = false
    }
    compileOnly("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_api_version}") {
        transitive = false
    }
    localRuntime fileTree(dir: 'libs', include: ['*.jar'], exclude: ['sable-neoforge-*.jar', 'create-aeronautics-bundled-*.jar'])
    localRuntime("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_api_version}") {
        transitive = false
    }
    localRuntime("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_api_version}") {
        transitive = false
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            sable_version_range   : sable_version_range,
            simulated_version_range : simulated_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('verifyHydraulicLengthControl', JavaExec) {
    group = 'verification'
    description = 'Check hydraulic length-control directions, limits, and impulse caps.'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.enxv.aerouniversaljoint.verification.HydraulicLengthControlRegressionCheck'
}

tasks.register('verifyCompatibilityContract', JavaExec) {
    group = 'verification'
    description = 'Check block-entity ids, persistent link tags, and the Sable 2.x minimum dependency.'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.enxv.aerouniversaljoint.verification.CompatibilityContractRegressionCheck'
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyHydraulicLengthControl')
    dependsOn tasks.named('verifyCompatibilityContract')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into ''
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
